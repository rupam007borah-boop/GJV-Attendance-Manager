
<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174b83">
<title>GJV Attendance Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;color:#222;font-family:Arial,sans-serif}
header{background:#174b83;color:white;padding:22px;text-align:center}
main{max-width:600px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#174b83;color:white;border:0;font-weight:bold}
label{font-weight:bold}
#message{white-space:pre-wrap;font-size:14px}
.muted{color:#666;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h2>GJV Attendance Manager</h2>
<p>GyanDeep Jatiya Vidyalaya</p>
</header>

<main>
<div class="card" id="loginCard">
<h3>Login / লগ ইন</h3>

<label>Email</label>
<input id="email" type="email" placeholder="Enter email">

<label>Password</label>
<input id="password" type="password" placeholder="Enter password">

<button id="loginBtn">Login</button>
<p class="muted">Admin আৰু Teacher-ৰ বাবে</p>
</div>

<div class="card hidden" id="dashboard">
<h3 id="welcome">Welcome</h3>
<p id="role"></p>
<p id="uid" class="muted"></p>
<button id="logoutBtn">Logout</button>
</div>

<p id="message"></p>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyC59avCn7uHDCXjpEK9p37XmSojixT27Ic",
 authDomain: "gjv-attendance-manager.firebaseapp.com",
 projectId: "gjv-attendance-manager",
 storageBucket: "gjv-attendance-manager.firebasestorage.app",
 messagingSenderId: "994581115572",
 appId: "1:994581115572:web:a0db5e510dbf06634fdde1",
 measurementId: "G-L5WBVVLGFP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

function message(text) {
 $("message").textContent = text;
}

$("loginBtn").onclick = async () => {
 const email = $("email").value.trim();
 const password = $("password").value;

 if (!email || !password) {
  message("Email আৰু Password দিয়ক।");
  return;
 }

 $("loginBtn").disabled = true;
 message("Login কৰি থকা হৈছে...");

 try {
  await signInWithEmailAndPassword(auth,email,password);
 } catch(error) {
  message("Login হোৱা নাই: " + error.message);
 } finally {
  $("loginBtn").disabled = false;
 }
};

$("logoutBtn").onclick = async () => {
 await signOut(auth);
 message("Logout হৈছে।");
};

onAuthStateChanged(auth, async user => {
 if (!user) {
  $("loginCard").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
  return;
 }

 message("Account যাচাই কৰা হৈছে...");

 try {
  const profileRef = doc(db,"users",user.uid);
  const profileSnap = await getDoc(profileRef);

  if (!profileSnap.exists()) {
   throw new Error("Admin-এ users profile পৰীক্ষা কৰক।");
  }

  const profile = profileSnap.data();

  if (profile.active !== true) {
   throw new Error("এই account সক্ৰিয় নহয়।");
  }

  if (!["admin","teacher"].includes(profile.role)) {
   throw new Error("Account role সঠিক নহয়।");
  }

  $("loginCard").classList.add("hidden");
  $("dashboard").classList.remove("hidden");

  $("welcome").textContent =
   "Welcome, " + (profile.name || "GJV User");

  $("role").textContent =
   profile.role === "admin"
   ? "Admin / প্ৰশাসক"
   : "Teacher / শিক্ষক";

  $("uid").textContent = "Account verified";

  message("");

 } catch(error) {
  message(
   "Profile যাচাই হোৱা নাই।\n" +
   error.message +
   "\nFirestore Security Rules-ৰ অনুমতি পৰীক্ষা কৰিব লাগিব।"
  );
 }
});
</script>
</body>
</html>
